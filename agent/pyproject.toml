[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2g-agent"
version = "0.1.0"
description = "r2g agent: RTL -> signed-off layout -> graph dataset, driven by any mainstream LLM"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx[socks]>=0.27",
  "pyyaml>=6",
  "mcp>=1.2,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
r2g = "r2g_agent.cli:main"

[tool.setuptools.packages.find]
include = ["r2g_agent*"]

[tool.setuptools.package-data]
r2g_agent = ["examples/*/*", "web/dist/**/*", "prompts/*.md", "task_skills/*.json", "task_skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
